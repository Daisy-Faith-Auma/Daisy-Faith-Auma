<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hi, I'm Daisy. Developer Relations Engineer, Technical Writer, Community Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#1a0f14"/>
    </linearGradient>
    <symbol id="petals-w" viewBox="-50 -50 100 100">
      <g fill="#ffffff">
        <ellipse cx="0" cy="-26" rx="9" ry="22"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(30)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(60)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(90)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(120)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(150)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(180)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(210)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(240)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(270)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(300)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(330)"/>
      </g>
      <circle r="13" fill="#ffd23f"/>
      <circle r="13" fill="none" stroke="#f5b700" stroke-width="2"/>
    </symbol>
    <symbol id="petals-p" viewBox="-50 -50 100 100">
      <g fill="#ff7eb3">
        <ellipse cx="0" cy="-26" rx="9" ry="22"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(30)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(60)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(90)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(120)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(150)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(180)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(210)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(240)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(270)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(300)"/>
        <ellipse cx="0" cy="-26" rx="9" ry="22" transform="rotate(330)"/>
      </g>
      <circle r="13" fill="#ffd23f"/>
    </symbol>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- stems -->
  <g stroke="#3d7a3a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M905 320 C 900 270, 915 240, 905 200"/>
    <path d="M1010 320 C 1020 260, 1000 200, 1015 140"/>
    <path d="M1110 320 C 1100 280, 1115 250, 1105 225"/>
  </g>

  <!-- swaying daisies -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 905 320; 3 905 320; -3 905 320" dur="5s" repeatCount="indefinite"/>
    <use href="#petals-w" xlink:href="#petals-w" x="855" y="150" width="100" height="100"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="2 1010 320; -3 1010 320; 2 1010 320" dur="6s" repeatCount="indefinite"/>
    <use href="#petals-p" xlink:href="#petals-p" x="950" y="80" width="120" height="120"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 1105 320; 4 1105 320; -2 1105 320" dur="4.5s" repeatCount="indefinite"/>
    <use href="#petals-w" xlink:href="#petals-w" x="1067" y="187" width="76" height="76"/>
  </g>

  <!-- tiny floating daisies -->
  <use href="#petals-p" xlink:href="#petals-p" x="760" y="40" width="34" height="34" opacity="0.8">
    <animate attributeName="y" values="40;30;40" dur="4s" repeatCount="indefinite"/>
  </use>
  <use href="#petals-w" xlink:href="#petals-w" x="1120" y="40" width="28" height="28" opacity="0.7">
    <animate attributeName="y" values="40;50;40" dur="5s" repeatCount="indefinite"/>
  </use>
  <use href="#petals-w" xlink:href="#petals-w" x="700" y="230" width="24" height="24" opacity="0.5">
    <animate attributeName="y" values="230;220;230" dur="3.5s" repeatCount="indefinite"/>
  </use>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="70" y="120" font-size="30" fill="#ff7eb3" font-weight="600">Hi there, I'm</text>
    <text x="70" y="195" font-size="76" fill="#ffffff" font-weight="800">Daisy Auma <tspan fill="#ffd23f">✿</tspan></text>
    <text x="72" y="245" font-size="24" fill="#d9d9d9">DevRel Engineer  <tspan fill="#ff7eb3">•</tspan>  Technical Writer  <tspan fill="#ff7eb3">•</tspan>  Community Builder</text>
  </g>
  <rect x="72" y="268" width="120" height="5" rx="2.5" fill="#ff7eb3"/>
</svg>
